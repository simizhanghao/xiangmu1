### Frozen SFT: Qwen3-8B + 1.5D coldstart_v2 (sharegpt_filled, 4550).
### Fast 4×80G LoRA: 8 × 2 accum × 4 GPUs = global batch 64 (unchanged).
### Do not point this file back at coldstart_v1. Smoke first; no train in this gate.

### model
model_name_or_path: /data1/hcc/deepresearch/Dee/model
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_target: all
deepspeed: /data1/hcc/LlamaFactory/examples/deepspeed/ds_z2_config.json

### dataset
dataset_dir: /data1/hcc/deepresearch/Dee/results/21_register_8b_coldstart_v2
dataset: eca_qwen3_8b_coldstart_v2_train
eval_dataset: eca_qwen3_8b_coldstart_v2_dev
template: qwen3_nothink
enable_thinking: false
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: /data1/hcc/deepresearch/Dee/outputs/21_sft_qwen3_8b_lora
logging_steps: 5
save_steps: 50
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: tensorboard

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
optim: adamw_torch_fused
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100
